name: CI

on:
  push:

jobs:
  test:
    name: Format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: The core has no window or audio dependency
        run: |
          if cargo tree --package picotracker-core --edges normal --prefix none --locked \
            | grep -E '^(winit|pixels|softbuffer|cpal|wgpu) '; then
            exit 1
          fi

  compile:
    name: Compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile
        run: cargo check --workspace --all-targets --locked
