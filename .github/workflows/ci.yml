name: CI

on:
  push:
  workflow_call:

jobs:
  licences:
    name: Licence allowlist and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: THIRD_PARTY_LICENSES is up to date
        run: |
          cargo fetch --locked
          cargo about generate --workspace --frozen --fail about.hbs -o THIRD_PARTY_LICENSES
          git diff --exit-code -- THIRD_PARTY_LICENSES


  test:
    name: Format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Constants, enums and struct fields carry no comments
        run: python3 -I scripts/check-item-comments.py crates
      - name: Tests
        run: cargo test --workspace --locked
      - name: The core has no window or audio dependency
        run: |
          if cargo tree --package pikutracker-core --edges normal --prefix none --locked \
            | grep -E '^(winit|pixels|softbuffer|cpal|wgpu) '; then
            exit 1
          fi

  compile:
    name: Compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile
        run: cargo check --workspace --all-targets --locked
