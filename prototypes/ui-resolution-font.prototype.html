<!doctype html>
<!-- PROTOTYPE — throwaway decision aid for adamico/picotracker#16. Never merge.
     Four logical resolution + bitmap font combinations for the split-pane layout (Song | Chain + Chain row strip | Phrase),
     switchable with ?variant=A|B|C|D, the bottom bar, or keys 1–4. Arrow keys belong to the fake tracker, not the switcher.
     The screen is drawn into a canvas at its logical size and scaled by the largest whole number that fits this browser
     window (in device pixels), with letterboxing — exactly what the `pixels` crate would do. Resize the window to feel it.
     Glyphs are hand-drawn for this prototype (a 3×5 PICO-8-like face and a generic 5×7 face), not copied from any font file. -->
<html><head><meta charset="utf-8"><title>Resolution and font prototype</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b0b}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#info{position:fixed;top:8px;right:8px;background:#fffe;color:#000;border-radius:8px;padding:8px 10px;max-width:440px;box-shadow:0 2px 12px #000a;font-size:12px}
#info h3{margin:0 0 4px;font-size:13px}#info table{border-collapse:collapse;margin-top:4px}#info td,#info th{padding:1px 6px;text-align:right;border-bottom:1px solid #ddd}#info th{text-align:right}
#info .bad{color:#c00;font-weight:bold}#info .ok{color:#080}
#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:20px;padding:6px 14px;box-shadow:0 2px 12px #000a;font:bold 13px sans-serif;display:flex;gap:12px;align-items:center;z-index:9}
#bar button{border:0;background:#000;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer}
</style></head><body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="info"></div>
<div id="bar"><button id="prev">◀</button><span id="lbl"></span><button id="next">▶</button></div>
<script>
// ---------------- fonts (hand-drawn, prototype only) ----------------
const F35={0:'xxx/x.x/x.x/x.x/xxx',1:'xx./.x./.x./.x./xxx',2:'xxx/..x/xxx/x../xxx',3:'xxx/..x/.xx/..x/xxx',4:'x.x/x.x/xxx/..x/..x',5:'xxx/x../xxx/..x/xxx',6:'x../x../xxx/x.x/xxx',7:'xxx/..x/..x/..x/..x',8:'xxx/x.x/xxx/x.x/xxx',9:'xxx/x.x/xxx/..x/..x',
A:'xxx/x.x/xxx/x.x/x.x',B:'xxx/x.x/xx./x.x/xxx',C:'xxx/x../x../x../xxx',D:'xx./x.x/x.x/x.x/xx.',E:'xxx/x../xx./x../xxx',F:'xxx/x../xx./x../x..',G:'xxx/x../x../x.x/xxx',H:'x.x/x.x/xxx/x.x/x.x',I:'xxx/.x./.x./.x./xxx',J:'xxx/.x./.x./.x./xx.',K:'x.x/x.x/xx./x.x/x.x',L:'x../x../x../x../xxx',M:'xxx/xxx/x.x/x.x/x.x',N:'xx./x.x/x.x/x.x/x.x',O:'.xx/x.x/x.x/x.x/xx.',P:'xxx/x.x/xxx/x../x..',Q:'.x./x.x/x.x/xx./.xx',R:'xxx/x.x/xx./x.x/x.x',S:'.xx/x../xxx/..x/xx.',T:'xxx/.x./.x./.x./.x.',U:'x.x/x.x/x.x/x.x/.xx',V:'x.x/x.x/x.x/xxx/.x.',W:'x.x/x.x/x.x/xxx/xxx',X:'x.x/x.x/.x./x.x/x.x',Y:'x.x/x.x/xxx/..x/xxx',Z:'xxx/..x/.x./x../xxx',
'-':'.../.../xxx/.../...','+':'.../.x./xxx/.x./...','#':'x.x/xxx/x.x/xxx/x.x','.':'.../.../.../.../.x.',':':'.../.x./.../.x./...','/':'..x/..x/.x./x../x..','|':'.x./.x./.x./.x./.x.','~':'.../x../xxx/..x/...','(':'.x./x../x../x../.x.',')':'.x./..x/..x/..x/.x.','>':'x../.x./..x/.x./x..','=':'.../xxx/.../xxx/...','_':'.../.../.../.../xxx','?':'xxx/..x/.xx/.../.x.',',':'.../.../.../.x./x..','*':'x.x/.x./x.x/.../...'};

A:'.xxx./x...x/x...x/xxxxx/x...x/x...x/x...x',B:'xxxx./x...x/x...x/xxxx./x...x/x...x/xxxx.',C:'.xxx./x...x/x..../x..../x..../x...x/.xxx.',D:'xxx../x..x./x...x/x...x/x...x/x..x./xxx..',E:'xxxxx/x..../x..../xxxx./x..../x..../xxxxx',F:'xxxxx/x..../x..../xxxx./x..../x..../x....',G:'.xxx./x...x/x..../x.xxx/x...x/x...x/.xxxx',H:'x...x/x...x/x...x/xxxxx/x...x/x...x/x...x',I:'.xxx./..x../..x../..x../..x../..x../.xxx.',J:'..xxx/...x./...x./...x./...x./x..x./.xx..',K:'x...x/x..x./x.x../xx.../x.x../x..x./x...x',L:'x..../x..../x..../x..../x..../x..../xxxxx',M:'x...x/xx.xx/x.x.x/x.x.x/x...x/x...x/x...x',N:'x...x/x...x/xx..x/x.x.x/x..xx/x...x/x...x',O:'.xxx./x...x/x...x/x...x/x...x/x...x/.xxx.',P:'xxxx./x...x/x...x/xxxx./x..../x..../x....',Q:'.xxx./x...x/x...x/x...x/x.x.x/x..x./.xx.x',R:'xxxx./x...x/x...x/xxxx./x.x../x..x./x...x',S:'.xxxx/x..../x..../.xxx./....x/....x/xxxx.',T:'xxxxx/..x../..x../..x../..x../..x../..x..',U:'x...x/x...x/x...x/x...x/x...x/x...x/.xxx.',V:'x...x/x...x/x...x/x...x/x...x/.x.x./..x..',W:'x...x/x...x/x...x/x.x.x/x.x.x/x.x.x/.x.x.',X:'x...x/x...x/.x.x./..x../.x.x./x...x/x...x',Y:'x...x/x...x/x...x/.x.x./..x../..x../..x..',Z:'xxxxx/....x/...x./..x../.x.../x..../xxxxx',
'-':'...../...../...../xxxxx/...../...../.....','+':'...../..x../..x../xxxxx/..x../..x../.....','#':'.x.x./.x.x./xxxxx/.x.x./xxxxx/.x.x./.x.x.','.':'...../...../...../...../...../.xx../.xx..',':':'...../.xx../.xx../...../.xx../.xx../.....','/':'...../....x/...x./..x../.x.../x..../.....','|':'..x../..x../..x../..x../..x../..x../..x..','~':'...../...../.x.../x.x.x/...x./...../.....','(':'...x./..x../.x.../.x.../.x.../..x../...x.',')':'.x.../..x../...x./...x./...x./..x../.x...','>':'x..../.x.../..x../...x./..x../.x.../x....','=':'...../...../xxxxx/...../xxxxx/...../.....','_':'...../...../...../...../...../...../xxxxx','?':'.xxx./x...x/....x/...x./..x../...../..x..',',':'...../...../...../...../.xx../..x../.x...','*':'...../..x../x.x.x/.xxx./x.x.x/..x../.....'};
const parse=f=>Object.fromEntries(Object.entries(f).map(([k,v])=>[k,v.split('/').map(r=>[...r].map(c=>c==='x'))]));
const FONTS={f35:{g:parse(F35),w:3,h:5,name:'3×5 PICO-8-like'},f57:{g:parse(F57),w:5,h:7,name:'5×7 generic'}};
// ---------------- variants: logical size, cell, font ----------------
const V={
 A:{name:'480×270, 4×6 cells, 3×5 font (PICO-8 look)',W:480,H:270,cw:4,ch:6,font:'f35',ox:0,oy:0},
 B:{name:'640×360, 6×8 cells, 5×7 font',W:640,H:360,cw:6,ch:8,font:'f57',ox:0,oy:0},
 C:{name:'960×540, 8×8 cells, 5×7 font (M8 spacing)',W:960,H:540,cw:8,ch:8,font:'f57',ox:1,oy:0},
 D:{name:'640×360, 4×6 cells, 3×5 font (2 rows of panes)',W:640,H:360,cw:4,ch:6,font:'f35',ox:0,oy:0,big:true},
};
// PICO-8 palette
const PAL=['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];
const BG=0,FG=6,DIM=5,HI=10,TITLE=12,CUR=12,FILL=14,GRN=11,HEAD=13;
// ---------------- fake project ----------------
const NOTES=['C-','C#','D-','D#','E-','F-','F#','G-','G#','A-','A#','B-'];
const hex=(v,n=2)=>v==null?'-'.repeat(n):v.toString(16).toUpperCase().padStart(n,'0');
const nn=n=>NOTES[n%12]+Math.floor(n/12);
const mkP=(notes,i=0,spd=16,len=16)=>({spd,len,steps:Array.from({length:32},(_,k)=>{const n=notes[k];return n==null?{n:24,i,v:0,fx:0}:{n,i,v:5,fx:k%8===6?1:0}})});
const P={0:mkP([24,,,,31,,,,36,,,,31,,29,],2),1:mkP([36,36,36,,39,,41,,43,43,,,41,,39,,36,,,,34,,36,,,,,,,,,],9,12,32),2:mkP([12,,,,12,,,,15,,,,10],1),3:mkP([30,,30,,30,30,,30],6,16,8)};
const ce=(ph,tsp=0,fill=false)=>({ph,tsp,fill});
const C={0:[ce(0),ce(0,5),ce(1),ce(1,-2)],1:[ce(2),ce(2),ce(2,3),ce(2)],2:[ce(3,0,true),ce(3,0,true),ce(3,0,true),ce(3,0,true)],3:[ce(1,12),ce(1,7)]};
for(const k in C)while(C[k].length<16)C[k].push(ce(null));
const song=Array.from({length:64},()=>Array(8).fill(null));
song[0]=[0,1,2,3,null,null,null,null];song[1]=[0,1,2,null,null,null,null,null];song[2]=[0,1,null,3,null,null,null,null];
const cur={pane:0,t:0,srow:0,crow:0,prow:0};let playRow=-1,playH=null;
const chainId=()=>song[cur.srow][cur.t];
const entry=()=>{const c=chainId();return c==null?null:C[c][cur.crow]};
const phraseId=()=>entry()?.ph??null;
function rowLen(k){let m=0,mf=0;for(let t=0;t<8;t++){const c=song[cur.srow][t];if(c==null)continue;const e=C[c][k];if(e.ph==null)continue;const L=P[e.ph].len*P[e.ph].spd;if(e.fill)mf=Math.max(mf,L);else m=Math.max(m,L)}return m||mf}
// ---------------- character grid ----------------
let G,cols,rows;const over=[];
function clear(){G=Array.from({length:rows},()=>Array.from({length:cols},()=>({c:' ',f:FG,b:BG})));over.length=0}
function put(x,y,s,f=FG,b=BG){s=String(s).toUpperCase();if(y>=rows){over.push('row '+y);return}
  for(let i=0;i<s.length;i++){if(x+i>=cols){over.push('col '+(x+i));return}if(x+i>=0)G[y][x+i]={c:s[i],f,b}}}
function vline(x,y0,y1){for(let y=y0;y<=Math.min(y1,rows-1);y++)if(x<cols)G[y][x]={c:'|',f:1,b:BG}}
// ---------------- panes (fixed character widths) ----------------
const W_SONG=28,W_CHAIN=33,W_PHR=19;
function songPane(x,y,h){const f=cur.pane===0;put(x,y,'SONG',TITLE);put(x+4,y,'  T1 T2 T3 T4 T5 T6 T7 T8',HEAD);
  const n=h-1,top=Math.max(0,Math.min(cur.srow-(n>>1),64-n));
  for(let r=0;r<n;r++){const R=top+r;put(x,y+1+r,hex(R),R%4?HEAD:GRN);for(let t=0;t<8;t++){const c=song[R][t];const on=R===cur.srow&&t===cur.t;put(x+4+t*3,y+1+r,hex(c),on?(f?BG:HI):c==null?DIM:FG,on&&f?CUR:BG)}}}
function chainPane(x,y,h){const f=cur.pane===1;const c=chainId();put(x,y,'CHAIN '+hex(c),TITLE);put(x+9,y,' T'+(cur.t+1)+' ROW '+hex(cur.srow),HEAD);
  put(x,y+1,'K PH TSP FILL',HEAD);
  for(let k=0;k<16;k++){const e=c==null?ce(null):C[c][k];const on=k===cur.crow;const fg=e.ph==null?DIM:FG;
    put(x,y+2+k,hex(k,1),HEAD);put(x+2,y+2+k,hex(e.ph),on&&f?BG:fg,on&&f?CUR:BG);put(x+5,y+2+k,(e.tsp>=0?'+':'-')+hex(Math.abs(e.tsp)),fg);put(x+9,y+2+k,e.fill?'FILL':'----',e.fill?FILL:DIM)}
  // Chain row strip
  const sy=y+19;put(x,sy,'CHAIN ROWS',TITLE);put(x,sy+1,'K T1 T2 T3 T4 T5 T6 T7 T8 TICK',HEAD);
  const n=Math.min(16,h-21);
  for(let k=0;k<n;k++){put(x,sy+2+k,hex(k,1),HEAD);for(let t=0;t<8;t++){const cc=song[cur.srow][t];const e=cc==null?null:C[cc][k];
      put(x+2+t*3,sy+2+k,e?.ph==null?'--':hex(e.ph),(t===cur.t&&k===cur.crow)?HI:e?.fill?FILL:e?.ph==null?DIM:GRN)}
    const L=rowLen(k);put(x+27,sy+2+k,L?String(L).padStart(4):'   -',L?FG:DIM)}}
function phrasePane(x,y,h){const f=cur.pane===2;const id=phraseId(),p=P[id];put(x,y,'PHRASE '+hex(id),TITLE);
  if(!p){put(x,y+2,'(EMPTY)',DIM);return}
  put(x,y+1,'SPD '+hex(p.spd)+' ~'+Math.round(1807/p.spd)+'BPM',FG);put(x,y+2,'LEN '+hex(p.len)+' NZ0 BZ0',FG);put(x,y+3,'DT0 RV1 DP0',FG);
  put(x,y+4,'   NOT IN V F',HEAD);
  for(let k=0;k<p.len&&5+k<h;k++){const s=p.steps[k],sil=s.v===0,on=k===cur.prow&&f;const yy=y+5+k;
    const b=k===playRow?1:BG;put(x,yy,hex(k)+' ',k%4?HEAD:GRN,b);put(x+3,yy,sil?'---':nn(s.n),on?BG:sil?DIM:FG,on?CUR:b);put(x+6,yy,' ',FG,b);
    put(x+7,yy,sil?'--':hex(s.i),sil?DIM:s.i>=8?FILL:FG,b);put(x+9,yy,' '+(sil?'-':s.v)+' '+s.fx,sil?DIM:FG,b)}
  if(p.len+5>h)put(x,y+h-1,'..MORE',8)}
function extraPane(x,y,w,h){ // what spare room could hold: Track mute/export strip + scope
  put(x,y,'TRACKS',TITLE);for(let t=0;t<8;t++){put(x,y+1+t,'T'+(t+1)+(t<4?' EXP CH'+t:' ----  '),t<4?GRN:DIM);put(x+11,y+1+t,t===2?'MUTE':'    ',8)}
  put(x,y+10,'SCOPE',TITLE);scope={x,y:y+11,w,h:Math.min(10,h-11)};
  put(x,y+22,'CART DEMO.P8',FG);put(x,y+23,'CLAIM SFX 08-1F',FG);put(x,y+24,'      PAT 00-07',FG)}
let scope=null;
function layout(v){clear();scope=null;
  const top='PICOTRACKER  DEMO.PTRK'+'  '+(playRow>=0?'> PLAY':'  STOP')+'  OCT 2';put(0,0,top,HI);
  put(0,rows-1,'TAB PANE  ARROWS MOVE  SPACE PLAY  1-4 VARIANT  H INFO',DIM);
  const y=2,h=rows-3;
  if(!v.big){let x=0;songPane(x,y,h);x+=W_SONG+1;vline(x-1,y,y+h-1);chainPane(x,y,h);x+=W_CHAIN+1;vline(x-1,y,y+h-1);phrasePane(x,y,h);x+=W_PHR+1;
    if(cols-x>=20){vline(x-1,y,y+h-1);extraPane(x,y,cols-x,h)}}
  else{ // D: panes side by side, then the whole Chain row strip and a wide Phrase with every Track
    let x=0;songPane(x,y,h);x+=W_SONG+1;vline(x-1,y,y+h-1);chainPane(x,y,h);x+=W_CHAIN+1;vline(x-1,y,y+h-1);phrasePane(x,y,h);x+=W_PHR+1;vline(x-1,y,y+h-1);
    // all 8 Tracks' Phrases at this Chain row, read-only (what the extra width buys)
    put(x,y,'CHAIN ROW '+hex(cur.crow,1)+' ALL TRACKS',TITLE);
    for(let t=0;t<8;t++){const c=song[cur.srow][t];const e=c==null?null:C[c][cur.crow];const p=e?.ph==null?null:P[e.ph];const xx=x+t*7;if(xx+6>cols)break;
      put(xx,y+1,'T'+(t+1)+' '+hex(e?.ph),t===cur.t?HI:HEAD);
      for(let k=0;k<32&&k<h-3;k++){const s=p?.steps[k];put(xx,y+2+k,!p||k>=p.len?'      ':s.v?nn(s.n)+hex(s.i):'-----',!p||k>=p.len?DIM:s.v?(k===playRow?HI:FG):DIM)}}}
}
// ---------------- draw ----------------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let vk;
function draw(){const v=V[vk];cols=Math.floor(v.W/v.cw);rows=Math.floor(v.H/v.ch);layout(v);
  cv.width=v.W;cv.height=v.H;const img=ctx.createImageData(v.W,v.H),d=img.data;const rgb=PAL.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
  const px=(x,y,c)=>{if(x<0||y<0||x>=v.W||y>=v.H)return;const o=(y*v.W+x)*4,q=rgb[c];d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2];d[o+3]=255};
  const fnt=FONTS[v.font];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const cell=G[y][x];const X=x*v.cw,Y=y*v.ch;
    if(cell.b)for(let j=0;j<v.ch;j++)for(let i=0;i<v.cw;i++)px(X+i,Y+j,cell.b);
    if(cell.c==='|'&&cell.f===1){for(let j=0;j<v.ch;j++)px(X+(v.cw>>1),Y+j,1);continue}
    const g=fnt.g[cell.c];if(!g)continue;for(let j=0;j<fnt.h;j++)for(let i=0;i<fnt.w;i++)if(g[j][i])px(X+i+v.ox,Y+j+(v.ch>fnt.h+1?1:0),cell.f)}
  for(let i=0;i<v.W*v.H;i++)if(!d[i*4+3])d[i*4+3]=255;
  if(scope){const sx=scope.x*v.cw,sy=scope.y*v.ch,sw=scope.w*v.cw-4,sh=scope.h*v.ch;const ph=performance.now()/200;
    for(let i=0;i<sw;i++){const yy=Math.round(sy+sh/2+Math.sin(i/7+ph)*sh*0.35*(playRow>=0?1:0.1)*Math.cos(i/23));px(sx+i,yy,GRN)}}
  ctx.putImageData(img,0,0);fit();info()}
function fit(){const v=V[vk],dpr=devicePixelRatio||1;const W=innerWidth*dpr,H=innerHeight*dpr;const s=Math.max(1,Math.floor(Math.min(W/v.W,H/v.H)));
  cv.style.width=v.W*s/dpr+'px';cv.style.height=v.H*s/dpr+'px';fit.s=s;fit.win=[Math.round(W),Math.round(H)]}
const MON=[['1366×768',1366,768],['1920×1080',1920,1080],['2560×1440',2560,1440],['3840×2160',3840,2160],['tiled half 960×1050',960,1050],['tiled half 1280×1410',1280,1410]];
let showInfo=true;
function info(){const el=document.getElementById('info');el.style.display=showInfo?'block':'none';if(!showInfo)return;const v=V[vk],fnt=FONTS[v.font];
  const rowsT=MON.map(([n,w,h])=>{const s=Math.floor(Math.min(w/v.W,h/v.H));const used=s?((v.W*s*v.H*s)/(w*h)*100).toFixed(0):0;
    return `<tr><td style="text-align:left">${n}</td><td class="${s<2?'bad':''}">${s?'×'+s:'<span class=bad>too small</span>'}</td><td>${s?v.W*s+'×'+v.H*s:''}</td><td>${s?fnt.h*s+'px':''}</td><td>${used}%</td></tr>`}).join('');
  el.innerHTML=`<h3>${vk}: ${v.name}</h3>
  Grid <b>${cols}×${rows}</b> characters (${v.cw}×${v.ch} cell, ${fnt.name}).<br>
  Split panes need ~${W_SONG+W_CHAIN+W_PHR+2} columns and ~${32+8} rows for a 32-Step Phrase.
  ${over.length?`<br><span class=bad>Overflow: ${over.length} cells clipped</span>`:'<br><span class=ok>Everything fits.</span>'}<br>
  This window: ${fit.win[0]}×${fit.win[1]} device px → <b>×${fit.s}</b>, glyph cap height ${fnt.h*fit.s}px.
  <table><tr><th style="text-align:left">window</th><th>scale</th><th>size</th><th>cap</th><th>filled</th></tr>${rowsT}</table>
  <div style="margin-top:4px;color:#555">Integer scale only, letterboxed. H hides this panel.</div>`}
// ---------------- keys ----------------
addEventListener('keydown',e=>{const k=e.key;
  if(/^[1-4]$/.test(k)){setV('ABCD'[+k-1]);return}
  if(k==='h'||k==='H'){showInfo=!showInfo;info();return}
  if(k==='Tab'){cur.pane=(cur.pane+(e.shiftKey?2:1))%3;e.preventDefault();draw();return}
  if(k===' '){if(playH){clearInterval(playH);playH=null;playRow=-1}else{playRow=0;playH=setInterval(()=>{const p=P[phraseId()];playRow=(playRow+1)%(p?.len??16);draw()},(P[phraseId()]?.spd??16)*1000/120)}e.preventDefault();draw();return}
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];if(!d)return;e.preventDefault();
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(cur.pane===0){cur.t=cl(cur.t+d[0],0,7);cur.srow=cl(cur.srow+d[1],0,63)}else if(cur.pane===1)cur.crow=cl(cur.crow+d[1],0,15);else cur.prow=cl(cur.prow+d[1],0,(P[phraseId()]?.len??16)-1);
  draw()});
addEventListener('resize',()=>{fit();info()});
const keys=Object.keys(V);
function setV(k){vk=k;const u=new URL(location);u.searchParams.set('variant',k);history.replaceState(null,'',u);document.getElementById('lbl').textContent=k+' ('+V[k].name+')';draw()}
document.getElementById('prev').onclick=()=>setV(keys[(keys.indexOf(vk)+3)%4]);
document.getElementById('next').onclick=()=>setV(keys[(keys.indexOf(vk)+1)%4]);
setV(V[new URLSearchParams(location.search).get('variant')]?new URLSearchParams(location.search).get('variant'):'A');
setInterval(()=>{if(playRow>=0)draw()},100);
