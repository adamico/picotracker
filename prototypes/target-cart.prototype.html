const CARTS={
 'GAME.P8':mk([{n:1,pat:[0,5],sfx:[0,1,...R(8,19)],inst:2,flow:'LOOPS',secs:38},{n:2,pat:[7,14],sfx:[0,2,...R(20,31)],inst:2,flow:'LOOPS',secs:62},{n:3,pat:[16,18],sfx:R(32,37),inst:0,flow:'STOPS',secs:11}],R(40,49)),

function slotCol(s){if(s.hl)return[BG,HI];if(s.over)return[WHITE,RED];if(s.claimed)return[BG,GRN];if(s.u)return[FG,NAVY];return[DIM,BG]}
function fmtSet(a){a=[...a].sort((x,y)=>x-y);const o=[];for(let i=0;i<a.length;){let j=i;while(a[j+1]===a[j]+1)j++;o.push(j>i?hex(a[i])+'-'+hex(a[j]):hex(a[i]));i=j+1}return o.join(' ')}
const fmtPat=p=>p?(p[0]===p[1]?hex(p[0]):hex(p[0])+'-'+hex(p[1])):'';
const patLen=p=>p?p[1]-p[0]+1:0;
function checks(){const o=[],n=claim.sfx.size,p=patRange(),c=cart();if(!c)return[{sev:'ERR',text:'NO TARGET CART: NOWHERE TO EXPORT.'}];
 o.push(n<NEED.sfx?{sev:'ERR',text:`NEEDS ${NEED.sfx} SFX, THE CLAIM HAS ${n}.`}:{sev:'OK ',text:`NEEDS ${NEED.sfx} SFX, THE CLAIM HAS ${n}.`});
 const low=[...claim.sfx].filter(i=>i<8).length;o.push(low<NEED.inst?{sev:'ERR',text:`${NEED.inst} CUSTOM INSTRUMENTS NEED SLOTS IN 00-07, THE CLAIM HAS ${low} THERE.`}:{sev:'OK ',text:`${NEED.inst} CUSTOM INSTRUMENTS FIT IN 00-07.`});
 o.push(patLen(p)<NEED.pat?{sev:'ERR',text:`NEEDS ${NEED.pat} PATTERNS, THE CLAIM HAS ${patLen(p)}.`}:{sev:'OK ',text:`NEEDS ${NEED.pat} PATTERNS, THE CLAIM HAS ${patLen(p)}.`});
 const os=[...claim.sfx].filter(i=>slot('sfx',i,c).over),op=p?R(p[0],p[1]).filter(i=>slot('pat',i,c).over):[];
 if(os.length)o.push({sev:'WRN',text:`EXPORT WILL OVERWRITE SFX ${fmtSet(os)}, WHICH HOLD OTHER SOUNDS.`});if(op.length)o.push({sev:'WRN',text:`EXPORT WILL OVERWRITE PATTERNS ${fmtSet(op)}.`});return o}

 let p=null;for(let i=0;i<=64-NEED.pat;i++)if(R(i,i+NEED.pat-1).every(j=>!c.pat[j]||ours.pat.has(j))){p=[i,i+NEED.pat-1];break}claim.p=p;anchor=null;syncBuf()}

function parseSfx(t){const s=new Set();for(const tok of t.trim().split(/[ ,]+/).filter(Boolean)){const m=tok.match(/^([0-9A-F]{1,2})(?:-([0-9A-F]{1,2}))?$/i);if(!m)return null;const a=parseInt(m[1],16),b=m[2]?parseInt(m[2],16):a;if(a>63||b>63||b<a)return null;R(a,b).forEach(i=>s.add(i))}return s}
function parsePat(t){t=t.trim();if(!t)return[null];const m=t.match(/^([0-9A-F]{1,2})(?:-([0-9A-F]{1,2}))?$/i);if(!m)return null;const a=parseInt(m[1],16),b=m[2]?parseInt(m[2],16):a;if(a>63||b>63||b<a)return null;return[[a,b]]}

// ---------------- grid ----------------
let G;
function clear(){G=Array.from({length:rows},()=>Array.from({length:cols},()=>({c:' ',f:FG,b:BG})))}
function put(x,y,s,f=FG,b=BG){s=String(s).toUpperCase();if(y<0||y>=rows)return;for(let i=0;i<s.length;i++){if(x+i>=cols)return;if(x+i>=0)G[y][x+i]={c:s[i],f,b}}}
function fillRect(x,y,w,h,b){for(let j=y;j<y+h&&j<rows;j++)for(let i=x;i<x+w&&i<cols;i++)G[j][i]={c:' ',f:FG,b}}
function vline(x,y0,y1){for(let y=y0;y<=Math.min(y1,rows-1);y++)G[y][x]={c:'|',f:NAVY,b:BG,line:1}}
function wrap(s,w){const out=[];let line='';for(const word of s.split(' ')){if((line+' '+word).trim().length>w){out.push(line);line=word}else line=(line?line+' ':'')+word}if(line)out.push(line);return out}
function title(x,y,w,label,f,right=''){fillRect(x,y,w,1,f?BLUE:BG);put(x,y,label,f?BG:BLUE,f?BLUE:BG);if(right)put(x+w-right.length,y,right,f?BG:HEAD,f?BLUE:BG)}
function rowBg(x,y,w,on){if(on)fillRect(x,y,w,1,NAVY);return on?NAVY:BG}

function header(extra){put(0,0,'PICOTRACKER',HI);put(13,0,songName+'  STOP  OCT 2',FG);if(extra)put(cols-extra.length,0,extra,HEAD)}

function tracksStrip(x,y){put(x,y,'TRACKS',BLUE);for(let t=0;t<8;t++){put(x,y+1+t,'T'+(t+1),HEAD);put(x+3,y+1+t,t<4?'EXPORT '+(t+1):'--',t<4?GRN:DIM)}}
// ---------------- variant A: Cart view ----------------
function renderA(){if(mode==='main')return renderMain();const f=mode==='claim';header('CART VIEW');title(0,2,70,'TARGET CART',mode==='files',mode==='claim'?'F CHANGE':'');put(13,2,mode==='files'?(FILES[fileSel]):pathOf(target),WHITE,mode==='files'?BLUE:BG);
 drawMap(0,4,'sfx',4,2,f&&area==='sfx');drawMap(36,4,'pat',4,2,f&&area==='pat');legend(0,23);vline(71,2,rows-3);
 if(f){inspect(area,cur[area]).forEach((l,i)=>put(0,25+i,l,i?FG:WHITE));if(anchor!=null)put(36,25,`RANGE ${fmtPat(patRange())}: SPACE TO SET IT`,HI);if(suggested)put(36,26,'SUGGESTED: THE LOWEST FREE SLOTS',HI);
  title(73,2,33,'CLAIM');put(73,3,'SFX',HEAD);let y=3;wrap(fmtSet(claim.sfx)||'NONE',28).forEach(l=>put(78,y++,l,GRN));put(73,y,'PAT',HEAD);put(78,y,fmtPat(patRange())||'NONE',GRN);drawChecks(73,y+2,33,rows-3);footer((area==='sfx'?'SPACE TOGGLE':'SPACE START/END RANGE')+'  TAB MAP  A AUTO  X CLEAR  F CART','ENTER SAVE  ESC CANCEL')}
 if(mode==='files'){title(73,2,33,importing?'IMPORT A CART':'CHOOSE A CART',true);drawFiles(73,3,33);put(0,25,'THE MAPS SHOW THE HIGHLIGHTED CART',DIM);footer('UP/DOWN PICK','ENTER CHOOSE  ESC '+(importing?'CANCEL':'BACK'))}
 if(mode==='songs'){title(73,2,33,'PICK ONE SONG',true,cart().songs.length+' IN THIS CART');drawSongs(73,4,33);put(0,25,'YELLOW SLOTS ARE WHAT THIS SONG USES. THEY BECOME THE CLAIM.',HI);footer('UP/DOWN PICK  P LISTEN','ENTER IMPORT  ESC BACK')}}
// ---------------- variant B: Cart pane ----------------
function miniMap(x,y,k){for(let i=0;i<64;i++){const s=slot(k,i),[f,b]=slotCol(s);const ch=s.hl?'#':s.over?'!':s.claimed?'#':s.u?'O':'.';put(x+(i%16),y+(i>>4),ch,f===BG?b:f,BG)}}
function bField(x,y,w,name,val,on){const lines=wrap(val||'-',w-1);put(x,y,name,on?HI:HEAD);y++;lines.forEach((l,i)=>{fillRect(x,y,w,1,on?NAVY:BG);put(x,y,l+(on&&i===lines.length-1?'_':''),on?WHITE:GRN,on?NAVY:BG);y++});return y}
function renderB(){const x=83,w=23;panes(mode==='songs');header(target?pathOf(target):'NO TARGET CART');const f=mode!=='main';title(x,2,w,mode==='songs'?'PICK ONE SONG':mode==='files'?(importing?'IMPORT':'CHOOSE A CART'):'CART',f);let y=3;
 if(mode==='files'){drawFiles(x,y,w);footer('UP/DOWN PICK','ENTER CHOOSE  ESC '+(importing?'CANCEL':'BACK'));return}
 if(mode==='songs'){drawSongs(x,y+1,w,true);footer('UP/DOWN PICK  P LISTEN  THE PANES PREVIEW THE SONG','ENTER IMPORT  ESC BACK');return}
 if(!target){put(x,y+1,'NO TARGET CART',DIM);put(x,y+3,'C CHOOSE ONE',FG);footer('C CART  SPACE PLAY');return}
 const on=mode==='claim';y=bField(x,y,w,'CART',pathOf(target),on&&field==='cart');y++;y=bField(x,y,w,'SFX '+claim.sfx.size+'/'+NEED.sfx,on?buf.sfx:fmtSet(claim.sfx),on&&field==='sfx');y++;y=bField(x,y,w,'PATTERNS '+patLen(claim.p)+'/'+NEED.pat,on?buf.pat:fmtPat(claim.p),on&&field==='pat');y++;
 put(x,y++,'SFX MAP',HEAD);miniMap(x,y,'sfx');y+=5;put(x,y++,'PATTERN MAP',HEAD);miniMap(x,y,'pat');y+=5;put(x,y++,'. FREE O USED # MINE',DIM);put(x,y++,'! OVERWRITES',RED);y++;drawChecks(x,y,w,rows-3);
 if(on)footer('TYPE HEX, E.G. 03 04 32-3D  TAB FIELD  = AUTO'+(field==='cart'?'  ENTER CHANGE CART':''),field==='pat'?'ENTER SAVE  ESC CANCEL':'ENTER NEXT  ESC CANCEL');else footer('C EDIT CART AND CLAIM  SPACE PLAY')}
// ---------------- variant C: step by step ----------------
function steps(labels,idx){let x=0;labels.forEach((p,i)=>{const s=`${i+1} ${p}`,on=i===idx;put(x,2,s,on?BG:i<idx?GRN:DIM,on?BLUE:BG);x+=s.length+1;if(i<labels.length-1){put(x,2,'>',DIM);x+=2}})}
function timeline(x,y,c){put(x,y,'WHERE EACH SONG SITS IN THE 64 PATTERNS',HEAD);for(let i=0;i<64;i++){const u=c.pat[i],sel=c.songs[pick]&&i>=c.songs[pick].pat[0]&&i<=c.songs[pick].pat[1];put(x+i,y+1,u?u[1]:'.',sel?BG:u?FG:DIM,sel?HI:u?NAVY:BG)}}
function renderC(){if(mode==='main')return renderMain();header(target||'');const L=importing?['CART','SONG','REVIEW']:['CART','SFX','PATTERNS','REVIEW'];
 if(mode==='files'){steps(L,0);title(0,5,46,importing?'WHICH CART DO YOU WANT TO IMPORT?':'WHICH CART DOES THIS PROJECT EXPORT INTO?',true);drawFiles(0,7,46);footer('UP/DOWN PICK','ENTER NEXT  ESC '+(importing?'CANCEL':'BACK'));return}
 if(mode==='songs'){const c=cart();if(ipage==='song'){steps(L,1);title(0,5,90,`${target} HOLDS ${c.songs.length} SONGS. PICK ONE.`,true);put(2,7,'SONG  PATTERNS  LENGTH  ENDS   SFX  INSTRUMENTS',HEAD);c.songs.forEach((s,i)=>{const on=i===pick,yy=9+i*2,b=rowBg(0,yy,90,on);put(0,yy,(on?'> ':'  ')+s.n,on?HI:FG,b);put(8,yy,fmtPat(s.pat),on?WHITE:FG,b);put(18,yy,mmss(s.secs),on?WHITE:FG,b);put(26,yy,s.flow,on?WHITE:FG,b);put(33,yy,String(s.sfx.length),on?WHITE:FG,b);put(38,yy,String(s.inst),on?WHITE:FG,b)});timeline(0,17,c);footer('UP/DOWN PICK  P LISTEN','ENTER NEXT  ESC BACK')}
  else{const s=c.songs[pick];steps(L,2);title(0,5,70,'WHAT WILL BE BUILT');[`SONG ${s.n}: ${patLen(s.pat)} SONG ROWS, ${mmss(s.secs)}`,`CLAIM: SFX ${fmtSet(s.sfx)}`,`CLAIM: PATTERNS ${fmtPat(s.pat)}`,`${c.loose.length} OTHER SFX BECOME LOOSE PHRASES, NOT CLAIMED`,`THE OTHER ${c.songs.length-1} SONGS ARE LEFT ALONE`].forEach((l,i)=>wrap(l,70).forEach((t,j)=>put(0,7+i*2+j,t,FG)));footer('','ENTER IMPORT  ESC BACK')}return}
 const idx={sfx:1,pat:2,review:3}[cpage];steps(L,idx);
 if(cpage==='review'){title(0,5,50,'THE CLAIM');put(0,7,'TARGET CART',HEAD);put(14,7,pathOf(target),WHITE);put(0,9,'SFX',HEAD);wrap(fmtSet(claim.sfx)||'NONE',36).forEach((l,i)=>put(14,9+i,l,GRN));put(0,12,'PATTERNS',HEAD);put(14,12,fmtPat(claim.p)||'NONE',GRN);drawChecks(54,5,52,rows-3);footer('','ENTER SAVE  ESC BACK');return}
 const k=cpage;area=k;drawMap(0,5,k,6,2,true,true);legend(0,24);title(52,5,54,k==='sfx'?'WHICH SFX SLOTS MAY THIS PROJECT WRITE?':'WHICH PATTERNS MAY THIS PROJECT WRITE?');let y=7;wrap(k==='sfx'?`THIS PROJECT NEEDS ${NEED.sfx} SFX. ${NEED.inst} OF THEM ARE CUSTOM INSTRUMENTS AND MUST BE IN 00-07.`:`THIS PROJECT NEEDS ${NEED.pat} PATTERNS IN ONE UNBROKEN RUN. THE SONG STARTS AT THE FIRST ONE, SO MUSIC(N) STAYS THE SAME.`,54).forEach(l=>put(52,y++,l,FG));y++;inspect(k,cur[k]).forEach((l,i)=>put(52,y++,l,i?FG:WHITE));y++;if(suggested){put(52,y++,'SUGGESTED: THE LOWEST FREE SLOTS',HI);y++}drawChecks(52,y,54,rows-3);footer((k==='sfx'?'SPACE TOGGLE':'SPACE START/END RANGE')+'  A AUTO  X CLEAR  F CART','ENTER NEXT  ESC BACK')}
// ---------------- the normal screen (A and C) ----------------
function renderMain(){const ex=vk==='A'?(target?`CART ${target}  ${claim.sfx.size} SFX  PAT ${fmtPat(claim.p)||'--'}`:'NO TARGET CART'):(target?target:'NO TARGET CART');header(ex);panes(false);tracksStrip(83,2);footer('C CART AND CLAIM  SPACE PLAY')}
// ---------------- draw ----------------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const rgb=PAL.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
function draw(){clear();({A:renderA,B:renderB,C:renderC})[vk]();cv.width=W;cv.height=H;const img=ctx.createImageData(W,H),d=img.data;
 const px=(x,y,c)=>{const o=(y*W+x)*4,q=rgb[c];d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2];d[o+3]=255};for(let i=0;i<W*H;i++)d[i*4+3]=255;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const cell=G[y][x],X=x*CW,Y=y*CH;if(cell.b)for(let j=0;j<CH;j++)for(let i=0;i<CW;i++)px(X+i,Y+j,cell.b);if(cell.line){for(let j=0;j<CH;j++)px(X+3,Y+j,NAVY);continue}const g=GL[cell.c];if(!g)continue;for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(g[j][i])px(X+i,Y+j,cell.f)}
 ctx.putImageData(img,0,0);fit();showState()}
function fit(){const dpr=devicePixelRatio||1,st=document.getElementById('stage'),r=Math.min(st.clientWidth*dpr/W,st.clientHeight*dpr/H),s=r>=1?Math.floor(r):r;cv.style.width=W*s/dpr+'px';cv.style.height=H*s/dpr+'px'}
// ---------------- side panel ----------------
const VD={A:['Cart view','One full-screen view, opened with C. Both 64-slot maps are always visible; the right column changes between file list, song list and Claim. You toggle slots with the cursor.'],B:['Cart pane','Stays in the right-hand pane, so Song, Chain and Phrase remain on screen. The Claim is typed as hex ranges, with small maps to check it. The panes preview the song you are picking.'],C:['Step by step','Pages in order, like the MIDI Import dialog: Cart, SFX, Patterns, Review. One large map per page, with each slot labelled by what uses it.']};
const SC=[['project','Project with a Target Cart','Open with C, then change the Claim.'],['none','First Export, no Target Cart','After a MIDI Import. Press Enter to choose a Cart.'],['import','Cart Import, several songs','Choose GAME.P8 to reach the song picker.']];
function side(){document.getElementById('side').innerHTML=`<div class="vdesc"><b>${vk}: ${VD[vk][0]}</b><br>${VD[vk][1]}</div>
 <h3>Try each situation</h3>${SC.map(([k,t,d])=>`<button data-s="${k}" class="${scene===k?'on':''}"><b>${t}</b><br>${d}</button>`).join('')}
 <h3>Keys</h3><div>Click the screen first. <span class=k>1</span>-<span class=k>3</span> variant, <span class=k>C</span> open, arrows move, <span class=k>Enter</span> confirm, <span class=k>Esc</span> back. The bottom row of the screen shows the rest.</div>
 <h3>Fake data</h3><div>The Project needs 14 SFX (2 are Custom Instruments, which must sit in 00–07) and 6 Patterns. GAME.P8 has 3 songs and 10 loose sound effects.</div>
 <h3>State</h3><pre id="st"></pre>`;document.querySelectorAll('#side button').forEach(b=>b.onclick=()=>{setScene(b.dataset.s);side();draw();cv.focus()})}
function showState(){const el=document.getElementById('st');if(!el)return;el.textContent=`scene: ${scene}\nmode: ${mode}${vk==='C'&&mode==='claim'?' / '+cpage:''}\ntarget: ${target?pathOf(target):'none'}\nclaim sfx: ${fmtSet(claim.sfx)||'none'}\nclaim patterns: ${fmtPat(claim.p)||'none'}\nsong picked: ${mode==='songs'?pick+1:'-'}\nchecks: ${checks().map(c=>c.sev.trim()).join(' ')}`}
// ---------------- keys ----------------
function move(dx,dy){const k=area;let c=cur[k]%8+dx,r=(cur[k]>>3)+dy;c=(c+8)%8;r=(r+8)%8;cur[k]=r*8+c}
function slotKeys(k,e){if(k===' '){e.preventDefault();suggested=false;if(area==='sfx'){const i=cur.sfx;claim.sfx.has(i)?claim.sfx.delete(i):claim.sfx.add(i)}else if(anchor==null)anchor=cur.pat;else{claim.p=patRange();anchor=null}syncBuf();return true}
 if(k==='a'||k==='A'){auto();suggested=true;return true}if(k==='x'||k==='X'){claim.sfx=new Set();claim.p=null;anchor=null;suggested=false;syncBuf();return true}if(k==='f'||k==='F'){mode='files';fileSel=Math.max(0,FILES.indexOf(target));return true}
 const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];if(d){e.preventDefault();move(...d);return true}return false}
addEventListener('keydown',e=>{const k=e.key;if(/^[1-3]$/.test(k)&&!(vk==='B'&&mode==='claim')){setV('ABC'[+k-1]);return}if(k==='Tab')e.preventDefault();
 if(mode==='main'){if(scene==='none'&&!target&&k==='Enter'){openCart();draw();return}if(scene==='none'&&!target&&k==='Escape'){status={c:'hint',t:'EXPORT CANCELLED'};draw();return}if(k==='c'||k==='C'){openCart();draw()}return}
 if(mode==='files'){if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();fileSel=(fileSel+(k==='ArrowUp'?-1:1)+FILES.length)%FILES.length}else if(k==='Enter')pickFile();else if(k==='Escape'){if(importing){setScene('project');side()}else if(snap&&snap.target){target=snap.target;mode='claim'}else cancelCart()}draw();return}
 if(mode==='songs'){const n=cart().songs.length;if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();if(!(vk==='C'&&ipage!=='song'))pick=(pick+(k==='ArrowUp'?-1:1)+n)%n}else if(k==='p'||k==='P'){status={c:'ok',t:`PLAYING SONG ${pick+1} OF THE CART (FAKE)`}}else if(k==='Enter'){status=null;if(vk==='C'&&ipage==='song')ipage='review';else doImport(pick)}else if(k==='Escape'){status=null;if(vk==='C'&&ipage!=='song')ipage='song';else{mode='files'}}draw();return}
 if(vk==='A'){if(k==='Tab'){area=area==='sfx'?'pat':'sfx';anchor=null}else if(k==='Enter')applyClaim();else if(k==='Escape')cancelCart();else slotKeys(k,e);draw();return}
 if(vk==='C'){if(k==='Enter'){anchor=null;if(cpage==='sfx'){cpage='pat';area='pat'}else if(cpage==='pat')cpage='review';else applyClaim()}else if(k==='Escape'){anchor=null;if(cpage==='review'){cpage='pat';area='pat'}else if(cpage==='pat'){cpage='sfx';area='sfx'}else cancelCart()}else if(cpage!=='review')slotKeys(k,e);draw();return}
 if(vk==='B'){const F=['cart','sfx','pat'];if(k==='Tab'){field=F[(F.indexOf(field)+(e.shiftKey?2:1))%3]}else if(k==='Escape')cancelCart();else if(k==='Enter'){if(field==='cart'){mode='files';fileSel=Math.max(0,FILES.indexOf(target))}else if(field==='sfx')field='pat';else applyClaim()}else if(k==='='){auto()}else if(field!=='cart'){if(k==='Backspace'){e.preventDefault();buf[field]=buf[field].slice(0,-1);liveParse()}else if(/^[0-9a-fA-F \-,]$/.test(k)){e.preventDefault();buf[field]+=k.toUpperCase();liveParse()}}draw()}});
addEventListener('resize',fit);
const keys=['A','B','C'];
function setV(k){vk=k;setScene(scene);const u=new URL(location);u.searchParams.set('variant',k);history.replaceState(null,'',u);document.getElementById('lbl').textContent=k+' ('+VD[k][0]+')';side();draw();cv.focus()}
document.getElementById('prev').onclick=()=>setV(keys[(keys.indexOf(vk)+2)%3]);
document.getElementById('next').onclick=()=>setV(keys[(keys.indexOf(vk)+1)%3]);
const q=new URLSearchParams(location.search).get('variant');setV(keys.includes(q)?q:'A');
</script></body></html>
